name: Release to PopIMPod

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 下载 xcframework 并更新版本
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "版本号: ${VERSION}"

          curl -L -o PopIMLib.xcframework.zip "${{ github.event.client_payload.oss_url }}" || curl -L -o PopIMLib.xcframework.zip "${{ github.event.client_payload.oss_url }}" || curl -L -o PopIMLib.xcframework.zip "${{ github.event.client_payload.oss_url }}"

          rm -rf PopIMLib/PopIMLib.xcframework
          unzip -q PopIMLib.xcframework.zip -d PopIMLib/

          sed -i '' "s/s.version[[:space:]]*=.*/s.version      = \"${VERSION}\"                # 版本号（必填，需与后续 tag 一致）/" PopIMLib.podspec

      - name: 创建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add PopIMLib/PopIMLib.xcframework PopIMLib.podspec
          git commit -m "Update PopIMLib to version ${VERSION}" || echo "无需提交"
          git push origin main || echo "推送失败或无需推送"

          # 清理已存在的 Release 和 tag
          if gh release view "${VERSION}" --repo ev8kdla9uzbg/PopIMLib >/dev/null 2>&1; then
            gh release delete "${VERSION}" --repo ev8kdla9uzbg/PopIMLib --yes
            git push --delete origin "${VERSION}" 2>/dev/null || true
            git tag -d "${VERSION}" 2>/dev/null || true
          fi

          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${VERSION})
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..${VERSION})
          fi

          gh release create "${VERSION}" PopIMLib.xcframework.zip \
            --title "PopIMLib ${VERSION}" --notes "${CHANGELOG}" \
            --repo ev8kdla9uzbg/PopIMLib

      - name: 校验 podspec 语法
        run: ruby -c PopIMLib.podspec

      - name: 推送 podspec 到 PopIMPod
        env:
          SPEC_REPO_TOKEN: ${{ secrets.SPEC_REPO_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version }}"

          git clone --depth 1 \
            "https://x-access-token:${SPEC_REPO_TOKEN}@github.com/ev8kdla9uzbg/PopIMPod.git" \
            "${RUNNER_TEMP}/specrepo"

          DEST="${RUNNER_TEMP}/specrepo/Specs/PopIMLib/${VERSION}"
          mkdir -p "${DEST}"
          cp PopIMLib.podspec "${DEST}/PopIMLib.podspec"

          cd "${RUNNER_TEMP}/specrepo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Specs
          git commit -m "PopIMLib ${VERSION}" || { echo "索引无变化，跳过"; exit 0; }
          git push origin HEAD:main

      - name: 完成
        run: echo "✅ 发布完成 - 版本 ${{ github.event.client_payload.version }}"

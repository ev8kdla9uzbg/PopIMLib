name: Release to CocoaPods

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 显示触发信息
        run: |
          echo "=========================================="
          echo "版本号: ${{ github.event.client_payload.version }}"
          echo "OSS URL: ${{ github.event.client_payload.oss_url }}"
          echo "=========================================="

      - name: 从 OSS 下载 xcframework
        run: |
          echo "下载 xcframework..."
          echo "OSS URL: ${{ github.event.client_payload.oss_url }}"
          curl -L -o PopIMLib.xcframework.zip "${{ github.event.client_payload.oss_url }}"
          echo "文件大小: $(stat -f%z PopIMLib.xcframework.zip) bytes"
          echo "文件类型检查:"
          file PopIMLib.xcframework.zip
          echo "文件头部内容:"
          head -c 200 PopIMLib.xcframework.zip | od -A x -t x1 -v

      - name: 更新仓库中的 xcframework
        run: |
          echo "解压并替换 xcframework..."
          rm -rf PopIMLib/PopIMLib.xcframework
          unzip -q PopIMLib.xcframework.zip -d PopIMLib/
          echo "✅ xcframework 已更新"

      - name: 更新 podspec 版本号
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "更新 PopIMLib.podspec 版本号为 ${VERSION}..."
          sed -i '' "s/s.version[[:space:]]*=.*/s.version      = \"${VERSION}\"                # 版本号（必填，需与后续 tag 一致）/" PopIMLib.podspec
          echo "✅ 版本号已更新"

      - name: 创建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "创建 Release ${VERSION}..."

          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 提交 xcframework 和 podspec 更新
          git add PopIMLib/PopIMLib.xcframework PopIMLib.podspec
          git commit -m "Update PopIMLib to version ${VERSION}" || echo "无需提交（版本号未变化）"
          git push origin main || echo "推送失败或无需推送"

          # 如果 Release 已存在，先删除 Release 和 tag
          if gh release view "${VERSION}" --repo ev8kdla9uzbg/PopIMLib >/dev/null 2>&1; then
            echo "Release ${VERSION} 已存在，删除 Release 和 tag..."
            gh release delete "${VERSION}" --repo ev8kdla9uzbg/PopIMLib --yes
            git push --delete origin "${VERSION}" 2>/dev/null || echo "远程 tag 已删除或不存在"
            git tag -d "${VERSION}" 2>/dev/null || echo "本地 tag 已删除或不存在"
          fi

          # 创建 tag
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          # 生成 changelog
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${VERSION})
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..${VERSION})
          fi

          # 创建 Release
          gh release create "${VERSION}" \
            PopIMLib.xcframework.zip \
            --title "PopIMLib ${VERSION}" \
            --notes "${CHANGELOG}" \
            --repo ev8kdla9uzbg/PopIMLib

      - name: 设置 Ruby 环境
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: 安装 CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: 配置网络和重试设置
        run: |
          echo "配置 Git HTTP 设置..."
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.version HTTP/1.1

          echo "配置 GitHub token..."
          git config --global github.token ${{ secrets.GITHUB_TOKEN }}

          echo "✅ 网络配置完成"

      - name: 运行诊断工具
        continue-on-error: true
        run: |
          chmod +x .github/scripts/diagnose.rb
          ruby .github/scripts/diagnose.rb

      - name: 验证 podspec（带重试）
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pod lib lint PopIMLib.podspec --allow-warnings --skip-import-validation --verbose
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置脚本执行权限
        run: |
          chmod +x .github/scripts/push_to_cocoapods.sh
          chmod +x .github/scripts/push_to_cocoapods.rb

      - name: 推送到 CocoaPods（方案1：使用 GitHub Action 重试）
        id: push_with_action
        continue-on-error: true
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 120
          retry_on: error
          command: pod trunk push PopIMLib.podspec --allow-warnings --skip-import-validation --verbose --synchronous
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUBY_HTTP_TIMEOUT: 600
          COCOAPODS_TRUNK_TIMEOUT: 600

      - name: 推送到 CocoaPods（方案2：使用 Ruby 脚本重试）
        id: push_with_ruby_script
        if: steps.push_with_action.outcome == 'failure'
        continue-on-error: true
        run: ruby .github/scripts/push_to_cocoapods.rb
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 CocoaPods（方案3：使用 Bash 脚本重试）
        id: push_with_bash_script
        if: steps.push_with_action.outcome == 'failure' && steps.push_with_ruby_script.outcome == 'failure'
        run: bash .github/scripts/push_to_cocoapods.sh
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查推送结果
        if: steps.push_with_action.outcome == 'failure' && steps.push_with_ruby_script.outcome == 'failure' && steps.push_with_bash_script.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "❌ 所有推送方案均失败"
          echo "=========================================="
          echo "请检查："
          echo "1. GitHub API 状态: https://www.githubstatus.com"
          echo "2. CocoaPods Trunk 状态: https://status.cocoapods.org"
          echo "3. COCOAPODS_TRUNK_TOKEN 是否有效"
          echo "=========================================="
          exit 1

      - name: 验证发布（带重试）
        if: steps.push_with_action.outcome == 'success' || steps.push_with_ruby_script.outcome == 'success' || steps.push_with_bash_script.outcome == 'success'
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            echo "等待 CocoaPods CDN 同步..."
            sleep 60
            pod search PopIMLib --simple | head -10

      - name: 完成
        run: |
          echo "=========================================="
          echo "✅ 发布完成"
          echo "版本: ${{ github.event.client_payload.version }}"
          echo "=========================================="

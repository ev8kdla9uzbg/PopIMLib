name: Release to CocoaPods

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 下载 xcframework 并更新版本
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "版本号: ${VERSION}"

          # 下载
          curl -L -o PopIMLib.xcframework.zip "${{ github.event.client_payload.oss_url }}"

          # 解压替换
          rm -rf PopIMLib/PopIMLib.xcframework
          unzip -q PopIMLib.xcframework.zip -d PopIMLib/

          # 更新 podspec 版本号
          sed -i '' "s/s.version[[:space:]]*=.*/s.version      = \"${VERSION}\"                # 版本号（必填，需与后续 tag 一致）/" PopIMLib.podspec

      - name: 创建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add PopIMLib/PopIMLib.xcframework PopIMLib.podspec
          git commit -m "Update PopIMLib to version ${VERSION}" || echo "无需提交"
          git push origin main || echo "推送失败或无需推送"

          # 清理已存在的 Release 和 tag
          if gh release view "${VERSION}" --repo ev8kdla9uzbg/PopIMLib >/dev/null 2>&1; then
            gh release delete "${VERSION}" --repo ev8kdla9uzbg/PopIMLib --yes
            git push --delete origin "${VERSION}" 2>/dev/null || true
            git tag -d "${VERSION}" 2>/dev/null || true
          fi

          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${VERSION})
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..${VERSION})
          fi

          gh release create "${VERSION}" PopIMLib.xcframework.zip \
            --title "PopIMLib ${VERSION}" --notes "${CHANGELOG}" \
            --repo ev8kdla9uzbg/PopIMLib

      - name: 设置 Ruby 环境
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: 安装 CocoaPods
        run: gem install cocoapods

      - name: 安装 coreutils
        run: brew install coreutils

      - name: 推送到 CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "尝试 $attempt/3 推送到 CocoaPods..."
            if gtimeout --kill-after=10 120 pod trunk push PopIMLib.podspec --allow-warnings --skip-import-validation --skip-tests --synchronous; then
              echo "✅ 推送成功！"
              exit 0
            fi
            echo "❌ 尝试 $attempt 失败"
            [ $attempt -lt 3 ] && sleep 30
          done
          echo "❌ 所有尝试均失败"
          exit 1

      - name: 完成
        run: echo "✅ 发布完成 - 版本: ${{ github.event.client_payload.version }}"
